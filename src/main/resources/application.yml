server:
  port: 8081
  # EP1.5-04: sin esto Spring oculta el message de ResponseStatusException (default never).
  error:
    include-message: always

spring:
  application:
    name: ms-barriodigital-requests
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Carga .env local si existe (nunca se sube a git). Ver .env.example.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: barriodigital-requests-oracle
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        oracle.net.tns_admin: ${ORACLE_WALLET_DIR}
  jpa:
    open-in-view: false
    hibernate:
      # Crea/actualiza municipal_requests en Oracle (EP1-14). Ver también db/schema.sql.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${RABBIT_USER:barriodigital}
    password: ${RABBIT_PASSWORD:guest}
    # Milisegundos. Con el broker caído no se queda 60 s esperando.
    connection-timeout: 2000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Contrato EP2-02. Mismas claves que notify.
barriodigital:
  rabbit:
    exchange:
      topic: cmd.topic
      direct: cmd.direct
      dead: cmd.dead.dlx
    queue:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing:
      email-send: email.send
      email-topic: "email.*"
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      email-dead: email.dead
      crew-dead: crew.dead
      certificate-dead: certificate.dead

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
