server:
  port: 8081
  # EP1.5-04: sin esto Spring oculta el message de ResponseStatusException (default never).
  error:
    include-message: always

spring:
  application:
    name: ms-barriodigital-requests
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Carga .env local si existe (nunca se sube a git). Ver .env.example.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: barriodigital-requests-oracle
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        oracle.net.tns_admin: ${ORACLE_WALLET_DIR}
  jpa:
    open-in-view: false
    hibernate:
      # Crea/actualiza municipal_requests en Oracle (EP1-14). Ver también db/schema.sql.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${RABBIT_USER:barriodigital}
    password: ${RABBIT_PASSWORD:guest}
    # Milisegundos. Con el broker caído no se queda 60 s esperando.
    connection-timeout: 2000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  # Los límites deben caber en la espera de 10 s del relay (KafkaConfig los valida).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 0
  # Relay y limpieza en hilos distintos.
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: requests-scheduled-

barriodigital:
  kafka:
    topic:
      requests-events: requests.events
  outbox:
    scheduling:
      enabled: true
    relay-delay-ms: 1000
  # Contrato EP2-02. Mismas claves que notify.
  rabbit:
    exchange:
      topic: cmd.topic
      direct: cmd.direct
      dead: cmd.dead.dlx
    queue:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing:
      email-send: email.send
      email-topic: "email.*"
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      email-dead: email.dead
      crew-dead: crew.dead
      certificate-dead: certificate.dead

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Sin Spring Security, when_authorized ocultaba los detalles del outbox. El 8081 no es público.
      show-details: always
  health:
    db:
      enabled: true
