openapi: 3.0.3
info:
  title: ms-barriodigital-requests
  version: 1.0.0
servers:
  - url: /
paths:
  /api/requests:
    get:
      operationId: list
      responses:
        '200':
          description: OK
    post:
      operationId: create
      responses:
        '200':
          description: OK
  /api/requests/{id}:
    get:
      operationId: get
      responses:
        '200':
          description: OK
  /api/requests/{id}/status:
    put:
      operationId: status
      responses:
        '200':
          description: OK
  /api/requests/{id}/rating:
    post:
      operationId: rating
      responses:
        '200':
          description: OK
  /api/requests/{id}/cancel:
    post:
      operationId: cancel
      responses:
        '200':
          description: OK
