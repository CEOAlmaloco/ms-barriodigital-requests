# Placeholders para que @WebMvcTest no falle al resolver application.yml
ORACLE_URL: jdbc:oracle:thin:@localhost:1521:xe
ORACLE_USER: test
ORACLE_PASSWORD: test
ORACLE_WALLET_DIR: .
server:
  error:
    include-message: always

spring:
  rabbitmq:
    addresses: 203.0.113.1:5672
    username: barriodigital
    password: guest
    connection-timeout: 2000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

barriodigital:
  rabbit:
    exchange:
      topic: cmd.topic
      direct: cmd.direct
      dead: cmd.dead.dlx
    queue:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing:
      email-send: email.send
      email-topic: "email.*"
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      email-dead: email.dead
      crew-dead: crew.dead
      certificate-dead: certificate.dead
