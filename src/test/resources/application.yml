# Placeholders para que @WebMvcTest no falle al resolver application.yml
ORACLE_URL: jdbc:oracle:thin:@localhost:1521:xe
ORACLE_USER: test
ORACLE_PASSWORD: test
ORACLE_WALLET_DIR: .
server:
  error:
    include-message: always

spring:
  # outbox_events la crea un script, como en Oracle: corre después de que Hibernate arma el esquema de H2.
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      schema-locations: classpath:db/h2-outbox-events.sql
  rabbitmq:
    addresses: 203.0.113.1:5672
    username: barriodigital
    password: guest
    connection-timeout: 2000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  # Copia de src/main con un broker inalcanzable.
  kafka:
    bootstrap-servers: 203.0.113.1:9092
    admin:
      auto-create: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 0

barriodigital:
  kafka:
    topic:
      requests-events: requests.events
  outbox:
    scheduling:
      enabled: false
    relay-delay-ms: 1000
  rabbit:
    exchange:
      topic: cmd.topic
      direct: cmd.direct
      dead: cmd.dead.dlx
    queue:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      crew: q.cmd.crew
      crew-dlq: q.cmd.crew.dlq
      certificate: q.cmd.certificate
      certificate-dlq: q.cmd.certificate.dlq
    routing:
      email-send: email.send
      email-topic: "email.*"
      crew-ticket: crew.ticket
      crew-topic: "crew.#"
      certificate-gen: certificate.gen
      certificate-topic: "certificate.*"
      email-dead: email.dead
      crew-dead: crew.dead
      certificate-dead: certificate.dead
